- name: "Retrieve Pod information"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    label_selectors:
      - "app=valkey-{{ item.name }}"
  register: vk_pod

- name: Copy backup file to the Pod
  kubernetes.core.k8s_cp:
    container: "{{ item.name }}-redis-external"
    local_path: "{{ directory.backup }}/{{ item.name }}-redis.db"
    namespace: "{{ item.project }}"
    pod: "{{ vk_pod }}"
    remote_path: /var/lib/redis/data/
    state: to_pod

- name: Create the append-only file
  kubernetes.core.k8s_exec:
    command:
      - redis-cli
      - BGREWRITEAOF
    container: "{{ item.name }}-redis-external"
    namespace: "{{ item.project }}"
    pod: "{{ vk_pod }}"

- name: Wait until AOF rewrite is not in progress
  kubernetes.core.k8s_exec:
    container: "{{ item.name }}-redis-external"
    command:
      - bash -c 'redis-cli info | grep aof_rewrite_in_progress'
    pod: "{{ vk_pod }}"
  register: aof_status
  until: aof_status.stdout.split(':')[1] | trim == "0"
  retries: 30
  delay: 10
  changed_when: false
