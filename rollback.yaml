- name: Checking APIManager instance status
  hosts: bastions
  tasks:
    - name: Retrieve APIManager instance information
      kubernetes.core.k8s_info:
        api_version: apps.3scale.net/v1alpha1
        kind: APIManager
        namespace: "{{ project.threescale }}"
      register: apimanager_crd
    - name: Stop if the APIManager instance was not found
      ansible.builtin.fail:
        msg: "No APIManager instances found"
      when: not apimanager_crd.api_found
    - name: Saving APIManager instance definition
      ansible.builtin.copy:
        backup: true
        content: "{{ apimanager_crd.resources[0] | to_yaml }}"
        dest: "{{ directory.backup }}/apimanager-rb.yaml"
        mode: '0400'
      no_log: true
    - name: Saving APIManager instance definition
      ansible.builtin.set_fact:
        apimanager: "{{ apimanager_crd.resources[0] }}"

- name: Scaling all replicas to zero
  hosts: bastions
  tasks:
    - name: Scale all DeploymentConfigs to zero
      ansible.builtin.include_tasks: scaling.yaml
      vars:
        replicas: 0
      with_items: "{{ deployments.elements }}"

- name: Restoring connection strings
  hosts: bastions
  tasks:
    - name: Restore connection string for MySQL
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: system-database
            namespace: "{{ project.threescale }}"
          stringData:
            URL: "mysql2://{{ external.mysql.user }}:{{ external.mysql.password }}@system-mysql/{{ external.mysql.database }}"
        state: patched

    - name: Restore connection string for Redis (system)
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: system-redis
            namespace: "{{ project.threescale }}"
          stringData:
            URL: "redis://system-redis:6379/1"
        state: patched

    - name: Restore connection string for Redis (backend)
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: backend-redis
            namespace: "{{ project.threescale }}"
          stringData:
            REDIS_STORAGE_URL: "redis://backend-redis:6379/0"
            REDIS_QUEUES_URL: "redis://backend-redis:6379/1"
        state: patched

- name: Removing external components
  hosts: bastions
  tasks:
    - name: Ask confirmation for MySQL deletion
      ansible.builtin.pause:
        prompt: "Do you want to delete the external MySQL deployment, service and PVC? (yes/no)"
      register: confirm_mysql
      when: external.components is defined

    - name: Delete MySQL deployment
      kubernetes.core.k8s:
        api_version: apps/v1
        kind: Deployment
        name: "{{ external.components.mysql.name }}"
        namespace: "{{ external.components.mysql.project }}"
        state: absent
      when: external.components is defined and confirm_mysql.user_input == 'yes'

    - name: Delete MySQL service
      kubernetes.core.k8s:
        api_version: v1
        kind: Service
        name: "{{ external.components.mysql.name }}"
        namespace: "{{ external.components.mysql.project }}"
        state: absent
      when: external.components is defined and confirm_mysql.user_input == 'yes'

    - name: Delete MySQL PVC
      kubernetes.core.k8s:
        api_version: v1
        kind: PersistentVolumeClaim
        name: "{{ external.components.mysql.name }}"
        namespace: "{{ external.components.mysql.project }}"
        state: absent
      when: external.components is defined and confirm_mysql.user_input == 'yes'

    - name: Ask confirmation for Valkey deletion
      ansible.builtin.pause:
        prompt: "Do you want to delete the external Valkey deployments, services and PVCs? (yes/no)"
      register: confirm_valkey
      when: external.components is defined

    - name: Delete Valkey resources
      ansible.builtin.include_tasks: valkey-delete.yaml
      loop: "{{ external.components.valkey }}"
      when: external.components is defined and confirm_valkey.user_input == 'yes'

- name: Updating Operator resources
  hosts: bastions
  tasks:
    - name: Updating Custom Resource Definition (CRD)
      kubernetes.core.k8s:
        definition:
          apiVersion: apps.3scale.net/v1alpha1
          kind: APIManager
          metadata:
            name: "{{ apimanager.metadata.name }}"
            namespace: "{{ project.threescale }}"
          spec:
            externalComponents:
              backend:
                redis: false
              system:
                database: false
                redis: false
        state: patched

- name: Scaling up all replicas
  hosts: bastions
  tasks:
    - name: Scale all up DeploymentConfigs
      ansible.builtin.include_tasks: scaling.yaml
      vars:
        replicas: "{{ item.replicas | default(1, true) }}"
      with_items: "{{ deployments.elements | list | reverse }}"
